name: Build and publish documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - CITATION.*
      - README.md
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - python/dpt/**
      - skills/**
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - CITATION.*
      - README.md
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - python/dpt/**
      - skills/**
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install --require-hashes -r docs/requirements.txt
      - name: Validate citation
        run: |
          python -m venv "$RUNNER_TEMP/citation-venv"
          "$RUNNER_TEMP/citation-venv/bin/python" -m pip install cffconvert==2.0.0
          "$RUNNER_TEMP/citation-venv/bin/cffconvert" --validate
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build manual
        run: python -m mkdocs build --strict
      - name: Save rendered documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dpt-documentation
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish manual
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
